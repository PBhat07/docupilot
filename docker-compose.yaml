
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docupilot-api
    env_file:
      - .env

    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy  
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./src:/app/src
      - ./scripts:/app/scripts
      - ./tests:/app/tests
      - ./data:/app/data
    command:
      - uvicorn
      - docupilot.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    restart: unless-stopped

  mongodb:
    image: mongo:8.0
    container_name: docupilot-mongodb
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.29.1
    container_name: docupilot-weaviate
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50051:50051"
    environment:
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      QUERY_DEFAULTS_LIMIT: "25"
    volumes:
      - weaviate_data:/var/lib/weaviate
  redis:
    image: redis:7.4-alpine
    container_name: docupilot-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped    
  
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docupilot-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: docupilot
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - rq worker --url "$$REDIS_URL" docupilot
    restart: unless-stopped

  
  evaluation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_EXTRAS: "dev,eval"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DATABASE: docupilot
      WEAVIATE_HOST: weaviate
      WEAVIATE_PORT: "8080"
      WEAVIATE_GRPC_PORT: "50051"
      EVAL_DATASET_PATH: /app/evaluation/dataset.json
      EVAL_OUTPUT_DIR: /app/data/evaluation/results
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
      weaviate:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./evaluation:/app/evaluation
      - ./data:/app/data
    command: ["python", "-m", "evaluation.runner"]
    profiles:
      - evaluation
  

volumes:
  mongodb_data:
  weaviate_data:
  redis_data:
  