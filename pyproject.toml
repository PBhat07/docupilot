
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docupilot"
version = "0.1.0"
description = "A version-aware, evidence-grounded technical documentation assistant."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.28.1",
    "beautifulsoup4==4.13.3",
    "trafilatura==2.0.0",
    "scrapy==2.13.3",
    "Twisted>=21.7.0,<=25.5.0",
    "pymongo==4.13.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
